<div class="container">
    <div class="row">
        <div class="col-md-4">
            <ul class="list-group mt-4">
                <li class="list-group-item" *ngFor="let s of sports$ | async">
                    My favourite sports {{s}}
                </li>
            </ul>
        </div>


        <div class="col-md-4">
            <ul class="list-group mt-4">
                <li class="list-group-item" *ngFor="let skill of skills$ | async">
                    Frontend Programing language {{skill}}
                </li>
            </ul>
        </div>


        <div class="col-md-4">
            <ul class="list-group mt-4">
                <li class="list-group-item" *ngFor="let color of colors$ | async">
                    This is a Color {{color}}
                </li>
            </ul>
        </div>


        <div class="col-md-4">
            <ul class="list-group mt-4">
                <li class="list-group-item" *ngFor="let books of books$ | async">
                    Must Read {{books}}
                </li>
            </ul>
        </div>


        <div class="col-md-4">
            <ul class="list-group mt-4">
                <li class="list-group-item" *ngFor="let p of product$ | async">
                    Available Product {{p}}
                </li>
            </ul>
        </div>
    </div>
</div>
