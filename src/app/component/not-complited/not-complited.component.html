<ul class="list-group" *ngIf="todosArrObs$ | async as todosArr; else notodos">
    <li class="list-group-item" *ngFor="let t of todosArr">
        <ng-container *ngIf="!t.completed">
            {{ t.title }} <strong>false</strong>
        </ng-container>
    </li>

</ul>

<ng-template #notodos>
    <p class="alert alert-warning">No Todos!!!</p>
</ng-template>
